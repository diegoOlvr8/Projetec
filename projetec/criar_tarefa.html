<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criar Tarefa</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

  <style>
    body { font-family: Arial, sans-serif; }
    .bg-primary { background: dodgerblue !important; }

    .campo { margin-top: 15px; }
  </style>
</head>

<body>

  <div class="bg-primary text-white p-3 d-flex justify-content-between align-items-center">
    <h1 class="m-0">Criar Tarefa</h1>
    <a href="home.html" class="btn btn-light">Voltar</a>
  </div>

  <div class="container mt-3">

    <form id="tarefaForm">

      <!-- CÔMODO -->
      <div class="mb-3">
        <label class="form-label">Para qual cômodo será a tarefa?</label>
        <select class="form-select" id="roomSelect">
          <option value="">Selecione…</option>
        </select>
      </div>

      <!-- PRIMEIRO: TAREFAS PRÉ-DEFINIDAS -->
      <div class="mb-3">
        <label class="form-label">Selecionar tarefa pré-definida:</label>
        <select class="form-select" id="taskSelect" disabled>
          <option value="">Selecione um cômodo primeiro</option>
        </select>
      </div>

      <!-- DEPOIS: DIGITAR TAREFA -->
      <div class="mb-3 campo">
        <label for="nome-tarefa">Ou digite sua própria tarefa:</label>
        <input
          id="nome-tarefa"
          type="text"
          class="form-control"
          placeholder="Digite o nome da tarefa"
          autocomplete="off"
        />
      </div>

      <!-- DATA -->
      <div class="mb-3">
        <label class="form-label">Data da tarefa:</label>
        <input id="data-tarefa" type="date" class="form-control" required />
      </div>

      <!-- PARTICIPANTE -->
      <div class="mb-3">
        <label class="form-label">Quem fará a tarefa?</label>
        <select class="form-select" id="participantSelect" required>
          <option value="">Selecione…</option>
        </select>
      </div>

      <!-- BOTÃO -->
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary btn-lg">Cadastrar Tarefa</button>
      </div>

    </form>

  </div>

  <script>
    const predefinedTasks = {
      cozinha: ["Lavar louça", "Tirar lixo", "Limpar fogão", "Organizar geladeira"],
      quarto: ["Arrumar cama", "Organizar guarda-roupa", "Varrer o chão"],
      banheiro: ["Lavar pia", "Lavar vaso", "Trocar toalhas", "Lavar box"],
      salaestar: ["Limpar TV", "Organizar sofá", "Tirar poeira"],
      areadeservico: ["Lavar roupas", "Estender roupas", "Recolher roupas"],
      garagem: ["Varrer chão", "Organizar ferramentas"],
      varanda: ["Varrer", "Regar plantas"],
      jardim: ["Podar plantas", "Regar jardim", "Tirar folhas secas"]
    };

    const roomSelect = document.getElementById("roomSelect");
    const taskSelect = document.getElementById("taskSelect");
    const inputNomeTarefa = document.getElementById("nome-tarefa");

    const participantSelect = document.getElementById("participantSelect");

    function carregarDados() {
      const perfil = JSON.parse(localStorage.getItem("perfil") || "{}");

      // CÔMODOS
      if (perfil.rooms) {
        perfil.rooms.forEach((r, i) => {
          const opt = document.createElement("option");
          opt.value = r.label;
          opt.textContent = r.label;
          roomSelect.appendChild(opt);
        });
      }

      // PARTICIPANTES
      if (perfil.participants) {
        perfil.participants.forEach(p => {
          const opt = document.createElement("option");
          opt.value = p.name;
          opt.textContent = p.name;
          participantSelect.appendChild(opt);
        });
      }
    }

    roomSelect.addEventListener("change", () => {
      const roomName = roomSelect.value;

      taskSelect.innerHTML = "";

      if (!roomName) {
        taskSelect.disabled = true;
        taskSelect.innerHTML = "<option>Selecione um cômodo primeiro</option>";
        return;
      }

      taskSelect.disabled = false;

      const lower = roomName.toLowerCase().replaceAll(" ", "");
      const tasks = predefinedTasks[lower] || [];

      taskSelect.innerHTML = '<option value="">Selecione…</option>';

      tasks.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = t;
        taskSelect.appendChild(opt);
      });
    });

    // Quando escolhe pré-definida → limpa campo digitado
    taskSelect.addEventListener("change", () => {
      if (taskSelect.value) {
        inputNomeTarefa.value = "";
      }
    });

    // Quando digita → remove seleção pré-definida
    inputNomeTarefa.addEventListener("input", () => {
      if (inputNomeTarefa.value.trim() !== "") {
        taskSelect.value = "";
      }
    });

    document.getElementById("tarefaForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const room = roomSelect.value;
      const predefined = taskSelect.value;
      const typed = inputNomeTarefa.value.trim();
      const date = document.getElementById("data-tarefa").value;
      const participant = participantSelect.value;

      if (!predefined && !typed) {
        alert("Escolha uma tarefa pré-definida ou digite uma manualmente.");
        return;
      }

      const tarefa = {
        room,
        nome: predefined || typed,
        date,
        participant,
        done: false,
        id: Date.now()
      };

      const lista = JSON.parse(localStorage.getItem("tarefas") || "[]");
      lista.push(tarefa);
      localStorage.setItem("tarefas", JSON.stringify(lista));

      alert("Tarefa cadastrada!");
      window.location.href = "home.html";
    });

    window.onload = carregarDados;
  </script>

</body>
</html>
