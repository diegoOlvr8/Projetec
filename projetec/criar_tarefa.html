<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criar Tarefa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div class="bg-primary text-white p-3 d-flex justify-content-between align-items-center">
    <h1>Criar Tarefa</h1>
    <a href="home.html" class="btn btn-light">Voltar</a>
  </div>

  <div class="container mt-3">
    <form id="tarefaForm">
      <div class="mb-3">
        <label class="form-label">Para qual cômodo será a tarefa?</label>
        <select class="form-select" id="roomSelect">
          <option value="">Selecione…</option>
        </select>
      </div>

      <div class="mb-3 campo">
        <label for="nome-tarefa">Nome da Tarefa:</label>
        <input
          id="nome-tarefa"
          type="text"
          class="form-control"
          placeholder="Digite o nome da tarefa"
          autocomplete="off"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Selecionar tarefa pré-definida (opcional):</label>
        <select class="form-select" id="taskSelect" disabled>
          <option value="">Selecione um cômodo primeiro</option>
        </select>
      </div>

      <button type="button" class="btn btn-primary" onclick="criarTarefa()">Criar Tarefa</button>
    </form>
  </div>

  <script>
    const tasksByType = {
      cozinha: [
        "Lavar a louça", "Secar e guardar a louça", "Limpar o fogão",
        "Limpar a geladeira (parte externa)", "Limpar a geladeira (parte interna)",
        "Jogar o lixo fora", "Tirar o lixo reciclável", "Limpar armários por dentro",
        "Limpar armários por fora", "Varrer o chão", "Passar pano no chão", "Limpar a pia",
        "Organizar as compras na despensa", "Descongelar e limpar o freezer",
        "Limpar micro-ondas por dentro/fora", "Organizar gavetas"
      ],
      quarto: [
        "Arrumar a cama", "Trocar a roupa de cama", "Guardar roupas limpas", "Dobrar roupas",
        "Separar roupas sujas", "Limpar móveis (poeira)", "Organizar armário",
        "Limpar ventilador/ar-condicionado", "Varrer o chão", "Passar pano no chão",
        "Organizar gavetas", "Limpar espelhos", "Aspirar o colchão", "Virar o colchão",
        "Recolher lixo do quarto"
      ],
      banheiro: [
        "Limpar o vaso sanitário", "Limpar o box", "Limpar os azulejos", "Limpar o espelho",
        "Limpar a pia", "Limpar o chão", "Trocar toalhas", "Trocar papel higiênico",
        "Lavar tapetes", "Jogar lixo fora", "Organizar produtos de higiene",
        "Lavar o ralo", "Tirar cabelos do ralo"
      ],
      salaestar: [
        "Tirar o pó dos móveis e superfícies",
        "Aspirar ou varrer o chão",
        "Passar pano no chão",
        "Organizar almofadas, mantas e objetos",
        "Limpar janelas e vidros",
        "Limpar aparelhos eletrônicos (TV, controles, etc.)",
        "Lavar cortinas ou limpar persianas",
        "Limpar ventiladores, lustres ou luminárias",
        "Desinfetar controles remotos e maçanetas",
        "Retirar lixo ou papéis acumulados"
      ],
      areadeservico: [
        "Lavar e estender roupas",
        "Passar roupas",
        "Dobrar e guardar roupas",
        "Limpar o tanque",
        "Limpar a máquina de lavar",
        "Organizar produtos de limpeza",
        "Varrer e passar pano no chão",
        "Tirar o pó de prateleiras e armários",
        "Esvaziar e limpar cestos de roupa suja",
        "Separar roupas para doação ou descarte"
      ],
      garagem: [
        "Varrer o chão",
        "Remover teias de aranha",
        "Organizar ferramentas e objetos",
        "Lavar o chão (se necessário)",
        "Limpar portas e janelas",
        "Lavar o carro",
        "Jogar fora objetos quebrados ou inúteis",
        "Separar itens para doação ou reciclagem",
        "Revisar prazos de validade de produtos armazenados",
        "Verificar iluminação (trocar lâmpadas queimadas)"
      ],
      varanda: [
        "Varrer e passar pano no chão",
        "Regar plantas",
        "Podar plantas",
        "Limpar vasos e suportes",
        "Limpar parapeitos e grades",
        "Tirar pó de móveis e objetos decorativos",
        "Lavar tapetes ou capachos",
        "Limpar janelas e vidros",
        "Recolher folhas secas",
        "Organizar cadeiras, mesas e itens de lazer"
      ],
      jardim: [
        "Cortar a grama",
        "Podar arbustos e árvores",
        "Regar as plantas",
        "Remover ervas daninhas",
        "Adubar o solo",
        "Plantar novas mudas ou sementes",
        "Recolher folhas secas",
        "Limpar ferramentas de jardinagem",
        "Organizar vasos e canteiros",
        "Verificar e ajustar sistemas de irrigação"
      ]
    };

    
    const perfil = JSON.parse(localStorage.getItem('perfil'));
    if (!perfil) {
      window.location.href = 'profile.html';
    }

    const roomSelect = document.getElementById('roomSelect');
    const taskSelect = document.getElementById('taskSelect');
    const nomeTarefaInput = document.getElementById('nome-tarefa');

    
    perfil.rooms.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.key;
      opt.dataset.type = r.type;
      opt.textContent = r.label;
      roomSelect.appendChild(opt);
    });

    
    roomSelect.addEventListener('change', () => {
      const selOpt = roomSelect.selectedOptions[0];
      if (!selOpt) {
        taskSelect.innerHTML = '<option value="">Selecione um cômodo primeiro</option>';
        taskSelect.disabled = true;
        return;
      }
      const type = selOpt.dataset.type;
      taskSelect.innerHTML = '<option value="">Selecione a tarefa</option>';

      if(tasksByType[type]){
        tasksByType[type].forEach(task => {
          const o = document.createElement('option');
          o.value = task;
          o.textContent = task;
          taskSelect.appendChild(o);
        });
        taskSelect.disabled = false;
      } else {
        taskSelect.innerHTML = '<option value="">Nenhuma tarefa disponível</option>';
        taskSelect.disabled = true;
      }
    });

    
    nomeTarefaInput.addEventListener('input', () => {
      if (nomeTarefaInput.value.trim() !== '') {
        taskSelect.value = '';
      }
    });

  
    taskSelect.addEventListener('change', () => {
      if (taskSelect.value !== '') {
        nomeTarefaInput.value = '';
      }
    });

    
    function criarTarefa() {
      const roomKey = roomSelect.value;
      const tarefaSelecionada = taskSelect.value.trim();
      const tarefaDigitada = nomeTarefaInput.value.trim();

      if (!roomKey) {
        alert('Escolha um cômodo.');
        return;
      }

      
      if (tarefaDigitada && tarefaSelecionada) {
        alert('Por favor, preencha apenas um dos campos: ou digite uma tarefa, ou selecione uma tarefa pré-definida.');
        return;
      }

      if (!tarefaDigitada && !tarefaSelecionada) {
        alert('Digite um nome de tarefa ou selecione uma tarefa pré-definida.');
        return;
      }

      const nomeTarefa = tarefaDigitada || tarefaSelecionada;

      const novaTarefa = {
        nome: nomeTarefa,
        data: new Date().toLocaleString()
      };

      const lista = JSON.parse(localStorage.getItem(`${roomKey}_tarefas`) || '[]');
      lista.push(novaTarefa);
      localStorage.setItem(`${roomKey}_tarefas`, JSON.stringify(lista));

      alert(`Tarefa "${nomeTarefa}" criada para ${roomSelect.selectedOptions[0].textContent}.`);

      document.getElementById('tarefaForm').reset();
      taskSelect.disabled = true;
    }
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .bg-primary {
      background-color: dodgerblue !important;
    }
  </style>
</body>
</html>
