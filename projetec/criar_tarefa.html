<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criar Tarefa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .bg-primary {
      background-color: #2a63fe !important; 
    }
    
    .back-btn {
      background: white;
      color: #2a63fe;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }
    
    .back-btn:hover {
      background: #f8f9fa;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .back-btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background-color: #2a63fe !important; 
      border-color: #2a63fe !important;
    }

    .btn-primary:hover {
      background-color: #1a4fd8 !important; 
      border-color: #1a4fd8 !important;
    }
  </style>
</head>
<body>
  <div class="bg-primary text-white p-3 d-flex justify-content-between align-items-center">
    <h1>Criar Tarefa</h1>

    <button class="back-btn" onclick="window.history.back()">Voltar</button>
  </div>

  <div class="container mt-3">
    <form id="tarefaForm">
      <div class="mb-3">
        <label class="form-label">Para qual cômodo será a tarefa?</label>
        <select class="form-select" id="roomSelect">
          <option value="">Selecione…</option>
        </select>
      </div>

      <div class="mb-3 campo">
        <label for="nome-tarefa">Nome da Tarefa:</label>
        <input
          id="nome-tarefa"
          type="text"
          class="form-control"
          placeholder="Digite o nome da tarefa"
          autocomplete="off"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Selecionar tarefa pré-definida (opcional):</label>
        <select class="form-select" id="taskSelect" disabled>
          <option value="">Selecione um cômodo primeiro</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="pontosTarefa" class="form-label">Pontuação da Tarefa:</label>
        <input type="number" id="pontosTarefa" class="form-control" placeholder="Exemplo: 10" min="1" max="1000" required>
      </div>

      <div class="mb-3">
        <label for="dataTarefa" class="form-label">Data da Tarefa:</label>
        <input type="date" id="dataTarefa" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="descricaoTarefa" class="form-label">Descrição da Tarefa (opcional):</label>
        <textarea 
          id="descricaoTarefa" 
          class="form-control" 
          placeholder="Adicione comentários, observações ou detalhes sobre a tarefa..."
          rows="3"
        ></textarea>
      </div>

      <div class="mb-3 form-check">
        <input class="form-check-input" type="checkbox" id="recorrenteCheck">
        <label class="form-check-label" for="recorrenteCheck">
          Tarefa Recorrente?
        </label>
      </div>

      <div id="recorrenciaCampos" style="display: none;" class="p-3 border rounded mb-3">
        <h5 class="mb-3">Configurar Recorrência</h5>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="horaSelect" class="form-label">Hora:</label>
            <select class="form-select" id="horaSelect"></select>
          </div>
          <div class="col-md-6">
            <label for="minutoSelect" class="form-label">Minuto:</label>
            <select class="form-select" id="minutoSelect"></select>
          </div>
        </div>

        <label class="form-label">Dias da Semana:</label>
        <div id="diasDaSemana" class="d-flex flex-wrap gap-2"></div>
        <div class="form-text">Clique para selecionar/desselecionar os dias.</div>
      </div>

      <button type="button" class="btn btn-primary" onclick="criarTarefa()">Criar Tarefa</button>
    </form>
  </div>

  <script>
    const tasksByType = {
      cozinha: [
        "Lavar a louça", "Secar e guardar a louça", "Limpar o fogão",
        "Limpar a geladeira (parte externa)", "Limpar a geladeira (parte interna)",
        "Jogar o lixo fora", "Tirar o lixo reciclável", "Limpar armários por dentro",
        "Limpar armários por fora", "Varrer o chão", "Passar pano no chão", "Limpar a pia",
        "Organizar as compras na despensa", "Descongelar e limpar o freezer",
        "Limpar micro-ondas por dentro/fora", "Organizar gavetas"
      ],
      quarto: [
        "Arrumar a cama", "Trocar a roupa de cama", "Guardar roupas limpas", "Dobrar roupas",
        "Separar roupas sujas", "Limpar móveis (poeira)", "Organizar armário",
        "Limpar ventilador/ar-condicionado", "Varrer o chão", "Passar pano no chão",
        "Organizar gavetas", "Limpar espelhos", "Aspirar o colchão", "Virar o colchão",
        "Recolher lixo do quarto"
      ],
      banheiro: [
        "Limpar o vaso sanitário", "Limpar o box", "Limpar os azulejos", "Limpar o espelho",
        "Limpar a pia", "Limpar o chão", "Trocar toalhas", "Trocar papel higiênico",
        "Lavar tapetes", "Jogar lixo fora", "Organizar produtos de higiene",
        "Lavar o ralo", "Tirar cabelos do ralo"
      ],
      salaestar: [
        "Tirar o pó dos móveis e superfícies",
        "Aspirar ou varrer o chão",
        "Passar pano no chão",
        "Organizar almofadas, mantas e objetos",
        "Limpar janelas e vidros",
        "Limpar aparelhos eletrônicos (TV, controles, etc.)",
        "Lavar cortinas ou limpar persianas",
        "Limpar ventiladores, lustres ou luminárias",
        "Desinfetar controles remotos e maçanetas",
        "Retirar lixo ou papéis acumulados"
      ],
      areadeservico: [
        "Lavar e estender roupas",
        "Passar roupas",
        "Dobrar e guardar roupas",
        "Limpar o tanque",
        "Limpar a máquina de lavar",
        "Organizar produtos de limpeza",
        "Varrer e passar pano no chão",
        "Tirar o pó de prateleiras e armários",
        "Esvaziar e limpar cestos de roupa suja",
        "Separar roupas para doação ou descarte"
      ],
      garagem: [
        "Varrer o chão",
        "Remover teias de aranha",
        "Organizar ferramentas e objetos",
        "Lavar o chão (se necessário)",
        "Limpar portas e janelas",
        "Lavar o carro",
        "Jogar fora objetos quebrados ou inúteis",
        "Separar itens para doação ou reciclagem",
        "Revisar prazos de validade de produtos armazenados",
        "Verificar iluminação (trocar lâmpadas queimadas)"
      ],
      varanda: [
        "Varrer e passar pano no chão",
        "Regar plantas",
        "Podar plantas",
        "Limpar vasos e suportes",
        "Limpar parapeitos e grades",
        "Tirar pó de móveis e objetos decorativos",
        "Lavar tapetes ou capachos",
        "Limpar janelas e vidros",
        "Recolher folhas secas",
        "Organizar cadeiras, mesas e itens de lazer"
      ],
      jardim: [
        "Cortar a grama",
        "Podar arbustos e árvores",
        "Regar as plantas",
        "Remover ervas daninhas",
        "Adubar o solo",
        "Plantar novas mudas ou sementes",
        "Recolher folhas secas",
        "Limpar ferramentas de jardinagem",
        "Organizar vasos e canteiers",
        "Verificar e ajustar sistemas de irrigação"
      ]
    };

    const perfil = JSON.parse(localStorage.getItem('perfil'));
    if (!perfil) {
      window.location.href = 'profile.html';
    }

    const roomSelect = document.getElementById('roomSelect');
    const taskSelect = document.getElementById('taskSelect');
    const nomeTarefaInput = document.getElementById('nome-tarefa'); 
    const pontosInput = document.getElementById('pontosTarefa');
    const dataTarefaInput = document.getElementById('dataTarefa');
    const descricaoTarefaInput = document.getElementById('descricaoTarefa');
    
    const recorrenteCheck = document.getElementById('recorrenteCheck');
    const recorrenciaCampos = document.getElementById('recorrenciaCampos');
    const horaSelect = document.getElementById('horaSelect');
    const minutoSelect = document.getElementById('minutoSelect');
    const diasDaSemanaDiv = document.getElementById('diasDaSemana');

    const diasSemana = [
      { nome: 'Dom', valor: 0 }, { nome: 'Seg', valor: 1 }, { nome: 'Ter', valor: 2 }, 
      { nome: 'Qua', valor: 3 }, { nome: 'Qui', valor: 4 }, { nome: 'Sex', valor: 5 }, 
      { nome: 'Sáb', valor: 6 }
    ];

    window.addEventListener('DOMContentLoaded', function() {
      const hoje = new Date().toISOString().split('T')[0];
      dataTarefaInput.min = hoje;
      dataTarefaInput.value = hoje;
    });
    
    function gerarOpcoesTempo() {
      for (let i = 0; i < 24; i++) {
        const hora = String(i).padStart(2, '0');
        const opt = document.createElement('option');
        opt.value = hora;
        opt.textContent = hora;
        horaSelect.appendChild(opt);
      }
      for (let i = 0; i < 60; i += 5) {
        const minuto = String(i).padStart(2, '0');
        const opt = document.createElement('option');
        opt.value = minuto;
        opt.textContent = minuto;
        minutoSelect.appendChild(opt);
      }
      horaSelect.value = "10";
      minutoSelect.value = "00";
    }

    function gerarBotoesDias() {
      diasSemana.forEach(dia => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.classList.add('btn', 'btn-outline-secondary', 'btn-sm');
        btn.textContent = dia.nome;
        btn.dataset.diaValor = dia.valor;
        btn.dataset.selecionado = 'false';

        btn.addEventListener('click', () => {
          if (btn.dataset.selecionado === 'false') {
            btn.dataset.selecionado = 'true';
            btn.classList.remove('btn-outline-secondary');
            btn.classList.add('btn-primary');
          } else {
            btn.dataset.selecionado = 'false';
            btn.classList.remove('btn-primary');
            btn.classList.add('btn-outline-secondary');
          }
        });
        diasDaSemanaDiv.appendChild(btn);
      });
    }

    perfil.rooms.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.key;
      opt.dataset.type = r.type;
      opt.textContent = r.label;
      roomSelect.appendChild(opt);
    });

    roomSelect.addEventListener('change', () => {
      const selOpt = roomSelect.selectedOptions[0];
      if (!selOpt) {
        taskSelect.innerHTML = '<option value="">Selecione um cômodo primeiro</option>';
        taskSelect.disabled = true;
        return;
      }
      const type = selOpt.dataset.type;
      taskSelect.innerHTML = '<option value="">Selecione a tarefa</option>';

      if(tasksByType[type]){
        tasksByType[type].forEach(task => {
          const o = document.createElement('option');
          o.value = task;
          o.textContent = task;
          taskSelect.appendChild(o);
        });
        taskSelect.disabled = false;
      } else {
        taskSelect.innerHTML = '<option value="">Nenhuma tarefa disponível</option>';
        taskSelect.disabled = true;
      }
    });

    nomeTarefaInput.addEventListener('input', () => {
      if (nomeTarefaInput.value.trim() !== '') {
        taskSelect.value = '';
      }
    });

    taskSelect.addEventListener('change', () => {
      if (taskSelect.value !== '') {
        nomeTarefaInput.value = '';
      }
    });

    recorrenteCheck.addEventListener('change', () => {
      recorrenciaCampos.style.display = recorrenteCheck.checked ? 'block' : 'none';
      dataTarefaInput.disabled = recorrenteCheck.checked;
      descricaoTarefaInput.disabled = recorrenteCheck.checked;
    });

    function criarTarefa() {
      const roomKey = roomSelect.value;
      const tarefaSelecionada = taskSelect.value.trim();
      const tarefaDigitada = nomeTarefaInput.value.trim();
      const isRecorrente = recorrenteCheck.checked; 
      const pontos = parseInt(pontosInput.value);
      const dataTarefa = dataTarefaInput.value;
      const descricao = descricaoTarefaInput.value.trim();

      if (!roomKey) {
        alert('Escolha um cômodo.');
        return;
      }

      if (!pontos || pontos < 1) {
        alert('Defina uma pontuação válida (mínimo 1).');
        return;
      }

      if (!isRecorrente && !dataTarefa) {
        alert('Selecione uma data para a tarefa.');
        return;
      }

      if (tarefaDigitada && tarefaSelecionada) {
        alert('Preencha apenas UM dos campos de tarefa (digitada OU pré-definida).');
        return;
      }

      if (!tarefaDigitada && !tarefaSelecionada) {
        alert('Digite uma tarefa ou selecione uma pré-definida.');
        return;
      }

      const nomeTarefa = tarefaDigitada || tarefaSelecionada;

      let dataCompleta;
      if (isRecorrente) {
        dataCompleta = new Date().toLocaleString();
      } else {
        const dataObj = new Date(dataTarefa);
        dataCompleta = dataObj.toLocaleString();
      }

      const novaTarefa = {
        nome: nomeTarefa,
        data: dataCompleta,
        isRecorrente: isRecorrente,
        pontos: pontos,
        dataISO: isRecorrente ? null : new Date(dataTarefa).toISOString(),
        desc: descricao || null
      };
      
      if (isRecorrente) {
        const hora = horaSelect.value;
        const minuto = minutoSelect.value;
        
        const diasSelecionados = Array.from(
          diasDaSemanaDiv.querySelectorAll('button[data-selecionado="true"]')
        ).map(btn => parseInt(btn.dataset.diaValor)); 

        if (diasSelecionados.length === 0) {
            alert('Selecione ao menos um dia para a tarefa recorrente.');
            return;
        }

        novaTarefa.recorrencia = {
          hora: hora,
          minuto: minuto,
          dias: diasSelecionados
        };
      }

      const lista = JSON.parse(localStorage.getItem(`${roomKey}_tarefas`) || '[]');
      lista.push(novaTarefa);
      localStorage.setItem(`${roomKey}_tarefas`, JSON.stringify(lista));

      alert(`Tarefa "${nomeTarefa}" criada com sucesso! Ela aparecerá no calendário.`);

      setTimeout(() => {
        window.location.href = 'home.html';
      }, 1500);
    }
    
    gerarOpcoesTempo();
    gerarBotoesDias();
  </script>
</body>
</html>
