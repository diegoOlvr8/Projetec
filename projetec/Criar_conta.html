<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        img{
            height: 150px;
            width: 150px;
            margin: 20px;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, rgb(42, 99, 254), #0072ff);
        }

        form {
            background-color: white;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 350px;
            animation: fadeIn 0.6s ease-in-out;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            background-color: rgb(42, 99, 254);
            color: white;
            transition: 0.3s;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            background-color: #005ecb;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<form action="http://localhost/Criar_conta.php" method="post">
    <img src="imagens/logo_usuario.png" alt="">
    <h2>Criar Conta</h2>
    <input type="email" name="usuarios" placeholder="Email" required>
    <input type="password" name="senhas" placeholder="Senha" required>
    <input type="password" name="confirmar" placeholder="Confirmar Senha" required>
    <input type="submit" name="Criar" value="Criar Conta">
</form>

</body>
</html>
