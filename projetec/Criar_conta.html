<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="http://localhost/Criar_conta.php">
        <img src="usuario.png" alt=""> <h2>Criar Conta</h2>
        <input class="nom" type="email" name="usuarios" placeholder="Email" required>
        <input class="senh" type="password" name="senhas" placeholder="Senha" required>
        <input class="confirmar" type="password" name="confirmar" placeholder="Confirmar senha" required>
    
        <div class="btn-container">
            <input class="procriar" type="submit" name="Criar" value="Criar Conta">
        </div>
    </form>

    <style>
        #olhar_senha{
            width: 30px;
            height: 30px;
            position: relative;
            top: 20px;
            left: 10px;
        }
                * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }
        
        img{
            height: 150px;
            width: 150px;
            margin: 20px;

    }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, dodgerblue, #0072ff);
        }

        form {
            background-color: white;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 350px;
            animation: fadeIn 0.6s ease-in-out;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: dodgerblue;
            box-shadow: 0 0 8px rgba(30, 144, 255, 0.3);
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
        }

        input[type="submit"] {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }


        .procriar {
            background-color: #f0f0f0;
            color: #333;
            position: relative;
            left: 65px;
        }

        .procriar:hover {
            background-color: #ddd;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</body>
</html>
