<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Tarefas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
   <style>
    .btn-success {
      background-color: #28a745 !important;
      border-color: #28a745 !important;
    }
  </style>

</head>
<body>
<div class="bg-primary text-white p-3 d-flex justify-content-between align-items-center">
    <h1 id="roomTitle"></h1>
    <a href="home.html" class="btn btn-light">Voltar</a>
  </div>

<div class="container mt-3">
   <h3>Lista de Tarefas</h3>
    <ul id="listaTarefas" class="list-group mb-3"></ul>
     <button id="btnRemoverConcluidas" class="btn btn-success w-100 mb-3" style="display:none;">Marcar tarefa(s) como concluída</button>

    <hr>
    <h4>Histórico de Tarefas Concluídas</h4>
    <ul id="historicoTarefas" class="list-group"></ul>
  </div>

  <div class="modal fade" id="participantModal" tabindex="-1" aria-labelledby="participantModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="participantModalLabel">Quem concluiu a(s) tarefa(s)?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <select id="participantSelect" class="form-select" required>
            <option value="">Selecione um participante...</option>
          </select>
          <div id="tasksSummary" class="mt-3 small text-muted"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-success" id="confirmCompletion">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const roomKey = params.get('key');
    
    
    let perfil = JSON.parse(localStorage.getItem('perfil') || '{}');
    let participants = perfil.participants || [];
    let selectedTasks = [];
    let participantModalInstance; 

    const listaTarefas = document.getElementById('listaTarefas');
    const historicoTarefas = document.getElementById('historicoTarefas');
    const btnRemover = document.getElementById('btnRemoverConcluidas'); 
    const participantSelect = document.getElementById('participantSelect');
    const confirmCompletionBtn = document.getElementById('confirmCompletion');
    const roomTitleElement = document.getElementById('roomTitle');
    
    

    function populateParticipants() {
        participantSelect.innerHTML = '<option value="">Selecione um participante...</option>';
        participants.forEach(p => {
            const id = p.id || p.name.replace(/\s/g, '').toLowerCase(); 
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = p.name;
            participantSelect.appendChild(opt);
        });
    }

    function carregarTarefas() {
      listaTarefas.innerHTML = '';
      const tarefasSalvas = JSON.parse(localStorage.getItem(`${roomKey}_tarefas`) || '[]');

      if (tarefasSalvas.length === 0) {
        listaTarefas.innerHTML = `<li class="list-group-item">Nenhuma tarefa cadastrada.</li>`;
        return;
      }

      tarefasSalvas.forEach((tarefa, index) => {

        if (tarefa.isRecorrente) return; 
        
        const item = document.createElement('li');
        item.className = 'list-group-item d-flex justify-content-between align-items-center';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'form-check-input me-2';

        checkbox.dataset.index = index; 
        
        checkbox.addEventListener('change', () => {
          item.classList.toggle('text-decoration-line-through', checkbox.checked);
          verificarConcluidas();
        });

        const texto = document.createElement('span');

        const pontosDisplay = tarefa.pontos ? ` (${tarefa.pontos} pts)` : '';

        const recorrenciaLabel = tarefa.geradaPorRecorrencia ? ' (Recorrente)' : ''; 
        texto.textContent = `${tarefa.nome}${pontosDisplay} (Criada em: ${tarefa.data})${recorrenciaLabel}`;

        item.prepend(checkbox);
        item.appendChild(texto);
        listaTarefas.appendChild(item);
      });
    }

    function verificarConcluidas() {
      const algumaMarcada = Array.from(listaTarefas.querySelectorAll('input[type=checkbox]'))
        .some(cb => cb.checked);
      btnRemover.style.display = algumaMarcada ? 'block' : 'none';
    }


  

    btnRemover.addEventListener('click', () => {
        selectedTasks = [];
        const checkboxes = Array.from(listaTarefas.querySelectorAll('input[type=checkbox]:checked'));
        const tarefasSalvas = JSON.parse(localStorage.getItem(`${roomKey}_tarefas`) || '[]');

        checkboxes.forEach(checkbox => {
            const taskIndex = parseInt(checkbox.dataset.index);
            selectedTasks.push({ index: taskIndex, task: tarefasSalvas[taskIndex] });
        });

        if (selectedTasks.length > 0) {
            let summaryText = 'Tarefas a concluir:<br>';
            selectedTasks.forEach(item => {
                const pontos = item.task.pontos !== undefined ? item.task.pontos : 1; 
                summaryText += `• ${item.task.nome} (${pontos} pts)<br>`;
            });
            document.getElementById('tasksSummary').innerHTML = summaryText;
            participantModalInstance.show();
        } else {
            alert('Nenhuma tarefa selecionada para conclusão.');
        }
    });

    confirmCompletionBtn.addEventListener('click', () => {
        const participantId = participantSelect.value;
        if (!participantId) {
            alert('Por favor, selecione quem concluiu a tarefa.');
            return;
        }

        const completer = participants.find(p => p.id === participantId) || participants.find(p => p.name.replace(/\s/g, '').toLowerCase() === participantId);
        const completerName = completer ? completer.name : 'Desconhecido';
        
        let tarefasSalvas = JSON.parse(localStorage.getItem(`${roomKey}_tarefas`) || '[]');
        let novasTarefas = [];
        let historicoSalvo = JSON.parse(localStorage.getItem(`${roomKey}_historico`) || '[]');
        let scoresSalvos = JSON.parse(localStorage.getItem('house_scores') || '[]');
        
        let indexesToRemove = new Set(selectedTasks.map(item => item.index));

        for (let i = 0; i < tarefasSalvas.length; i++) {
            const tarefaOriginal = tarefasSalvas[i];
            const isSelectedForCompletion = indexesToRemove.has(i);

            if (isSelectedForCompletion) {
                const pontos = tarefaOriginal.pontos !== undefined ? tarefaOriginal.pontos : 1;
                
                scoresSalvos.push({
                    participantId: participantId,
                    participantName: completerName,
                    points: pontos,
                    date: new Date().toISOString(),
                    taskName: tarefaOriginal.nome,
                    roomKey: roomKey
                });

                historicoSalvo.push({
                    nome: tarefaOriginal.nome,
                    dataConclusao: new Date().toLocaleString(),
                    concluidaPor: completerName,
                    pontos: pontos
                });

                if (tarefaOriginal.isRecorrente) {
                    novasTarefas.push(tarefaOriginal);
                }
            } else {
                novasTarefas.push(tarefaOriginal);
            }
        }
        
        localStorage.setItem(`${roomKey}_tarefas`, JSON.stringify(novasTarefas));
        localStorage.setItem(`${roomKey}_historico`, JSON.stringify(historicoSalvo));
        localStorage.setItem('house_scores', JSON.stringify(scoresSalvos));

        participantModalInstance.hide();
        carregarTarefas();
        carregarHistorico();
        btnRemover.style.display = 'none';
    });


    function carregarHistorico() {
      const historico = JSON.parse(localStorage.getItem(`${roomKey}_historico`) || '[]');
      historicoTarefas.innerHTML = '';

      if (historico.length === 0) {
        historicoTarefas.innerHTML = `<li class="list-group-item">Nenhuma tarefa concluída.</li>`;
        return;
      }

      historico.forEach(h => {
        const item = document.createElement('li');
        item.className = 'list-group-item d-flex justify-content-between align-items-center';

        const concluidaPorDisplay = h.concluidaPor ? ` por ${h.concluidaPor}` : '';
        const pontosDisplay = h.pontos ? ` (${h.pontos} pts)` : '';

        const texto = document.createElement('span');
        texto.textContent = `${h.nome} ${pontosDisplay} - Concluída em: ${h.dataConclusao}${concluidaPorDisplay}`;

        const checkIcon = document.createElement('i');
        checkIcon.className = 'fas fa-check-circle text-success ms-2';

        item.appendChild(texto);
        item.appendChild(checkIcon);
        historicoTarefas.appendChild(item);
      });
    }

    (function init() {
        if (!roomKey) {
            window.location.href = 'home.html';
            return;
        }
        
        if (typeof bootstrap !== 'undefined' && document.getElementById('participantModal')) {
            participantModalInstance = new bootstrap.Modal(document.getElementById('participantModal'));
        }

        const room = perfil.rooms ? perfil.rooms.find(r => r.key === roomKey) : null;
        
        if (!room) {
            window.location.href = 'home.html';
            return;
        }

        document.title = `Tarefas - ${room.label}`;
        roomTitleElement.textContent = room.label;

        populateParticipants(); 
        carregarTarefas();
        carregarHistorico();
    })();

  </script>
</body>
</html>
