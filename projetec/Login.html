<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        h1 {
            color: #1e90ff;
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .form-container img {
            display: block;
            margin: 0 auto 20px;
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background-color: #f9f9f9;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #1e90ff;
            background-color: #e6f2ff;
            outline: none;
        }

        input[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #1e90ff;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #4682b4;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .button-group input {
            width: 48%;
        }

        p {
            font-size: 14px;
            color: #555;
            margin-top: 20px;
        }

        a {
            color: #1e90ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <div class="form-container">
        <h1>Bem-vindo</h1>
        <img src="Imagem de logo do login_html.gif" alt="Logo">
        <form action="Login.php" method="post">
            <input type="text" name="a" placeholder="Usuário" required><br>
            <input type="password" name="b" placeholder="Senha" required><br>
            <div class="button-group">
                <input type="submit" name="Entrar" value="Entrar">
                <input type="submit" name="Criar" value="Criar">
            </div>
        </form>
        <p>Não tem uma conta? <a href="#">Criar conta</a></p>
    </div>
</body>
</html>
