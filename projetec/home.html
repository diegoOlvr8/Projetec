<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    rel="stylesheet"
  />
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <style>
    body { font-family: Arial, sans-serif; }
    .bg-primary { background-color: dodgerblue !important; }
    .img-fluid { max-width: 100%; height: auto; }
    .logo { height: 80px; width: 80px; }
    h1 { color: white; text-align: center; padding-left: 15px; }
  </style>
</head>
<body>
  <div class="bg-primary text-white p-3 d-flex justify-content-between align-items-center">
    <img class="logo" src="imagens/logo_branco.png" alt="Logo" />
    <h1>Bem-Vindo(a)!</h1>
    <a href="profile.html" class="d-flex align-items-center">
      <img id="userPhoto" src="" alt="Foto do Usuário"
        style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-right: 8px; display: none; border: 2px solid white;">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="white" class="bi bi-person-circle" viewBox="0 0 16 16">
        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
        <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
      </svg>
    </a>
  </div>

  <div id="cardsArea" class="container mt-1 pt-4">
    <div id="cardsRow" class="row justify-content-center"></div>
  </div>

  <div class="d-flex justify-content-around fixed-bottom bg-light p-2">
    <a href="criar_tarefa.html" class="btn btn-primary">
      <i class="fas fa-plus"></i>
    </a>
  </div>

  <script>

    function verificarTarefasRecorrentes() {
        const perfil = JSON.parse(localStorage.getItem("perfil"));
        if (!perfil || !perfil.rooms) return;

        const agora = new Date();
        const diaAtual = agora.getDay();
        
        const ultimaChecagemKey = 'ultimaChecagemRecorrente';

        let dataUltimaChecagem = new Date(localStorage.getItem(ultimaChecagemKey) || 0); 
        
        const umDiaAtras = new Date(agora.getTime() - (24 * 60 * 60 * 1000));
        if (dataUltimaChecagem < umDiaAtras) {
            dataUltimaChecagem = umDiaAtras;
        }


        perfil.rooms.forEach(comodo => {
            const roomKey = comodo.key;
            
            const todasAsTarefas = JSON.parse(localStorage.getItem(`${roomKey}_tarefas`) || '[]');
            
            const regrasRecorrentes = todasAsTarefas.filter(t => t.isRecorrente && t.recorrencia);
            
            if (regrasRecorrentes.length === 0) return;

            const novasTarefasGeradas = [];

            regrasRecorrentes.forEach(regra => {
                const recorrencia = regra.recorrencia;

                if (recorrencia.dias && recorrencia.dias.includes(diaAtual)) {
                    
                    const dataDeHojeComHoraDaRegra = new Date();
                    dataDeHojeComHoraDaRegra.setHours(parseInt(recorrencia.hora));
                    dataDeHojeComHoraDaRegra.setMinutes(parseInt(recorrencia.minuto));
                    dataDeHojeComHoraDaRegra.setSeconds(0);
                    dataDeHojeComHoraDaRegra.setMilliseconds(0);
                    

                    if (dataDeHojeComHoraDaRegra > dataUltimaChecagem && dataDeHojeComHoraDaRegra <= agora) {
                        
                        const dataParaExibicao = dataDeHojeComHoraDaRegra.toLocaleString();

                        const jaExisteHoje = todasAsTarefas.some(t => 
                            !t.isRecorrente && t.nome === regra.nome && t.data === dataParaExibicao
                        );

                        if (!jaExisteHoje) {

                            const novaTarefaInstancia = {
                                nome: regra.nome, 
                                data: dataParaExibicao,
                                isRecorrente: false,
                                geradaPorRecorrencia: true
                            };
                            novasTarefasGeradas.push(novaTarefaInstancia);
                            console.log(`Tarefa Gerada: ${regra.nome} para ${dataParaExibicao}`);
                        }
                    }
                }
            });
            
            if (novasTarefasGeradas.length > 0) {
                const listaAtualizada = todasAsTarefas.concat(novasTarefasGeradas);
                localStorage.setItem(`${roomKey}_tarefas`, JSON.stringify(listaAtualizada));
                console.log(`[Recorrência] Geradas ${novasTarefasGeradas.length} tarefas para ${comodo.label}.`);
            }
        });
        
        localStorage.setItem(ultimaChecagemKey, agora.toISOString());
    }

    verificarTarefasRecorrentes(); 

    document.addEventListener("DOMContentLoaded", () => {
      const perfil = JSON.parse(localStorage.getItem("perfil"));
      if (!perfil) {
        window.location.href = "profile.html";
        return;
      }

      const userPhotoElem = document.getElementById("userPhoto");
      if (perfil.photo) {
        userPhotoElem.src = perfil.photo;
        userPhotoElem.style.display = "inline-block";
      }

      const cardsRow = document.getElementById("cardsRow");
      const defaultImgs = {
        cozinha: "maxresdefault.jpg",
        quarto: "quarto_grande_com_sacada_dc22_original.jpeg",
        banheiro: "box-de-banheiro-_1742577922783.jpg",
        salaestar: "sala_de_tv_com_parede_de_tijolos_4702_original.jpeg",
        areadeservico: "lavanderia-organizada-1280x720.jpg",
        garagem: "acngfpkhjcg3edwifv8s.jpg",
        varanda: "Os-Beneficios-de-Uma-Varanda-Gourmet-.jpeg",
        jardim: "jardimmuitogay60de4.jpg",
      };

      perfil.rooms.forEach(room => {
        const col = document.createElement("div");
        col.className = "col-12 col-md-4 mb-4 d-flex justify-content-center";
        col.innerHTML = `
          <a href="room.html?key=${encodeURIComponent(room.key)}">
            <img src="${defaultImgs[room.type] || "placeholder.jpg"}"
                  alt="${room.label}"
                  class="img-fluid rounded" style="max-width:90%;">
            <h5 class="text-center mt-2">${room.label}</h5>
          </a>`;
        cardsRow.appendChild(col);
      });
    });
  </script>
</body>
</html>
