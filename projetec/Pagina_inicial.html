<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Inicial</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, rgb(42, 99, 254), #4a90e2);
      color: white;
      overflow: hidden;
    }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
      letter-spacing: 1px;
    }

    .hero p {
      font-size: 1.2rem;
      color: #f5f5f5;
      max-width: 600px;
      margin-bottom: 40px;
    }

    .hero img {
      height: 180px;
      width: auto;
      margin-bottom: 30px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .btn-custom {
      background-color: white;
      color: rgb(42, 99, 254);
      font-weight: bold;
      border: none;
      padding: 12px 40px;
      border-radius: 30px;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-custom:hover {
      background-color: #f0f0f0;
      transform: scale(1.05);
    }

    footer {
      position: absolute;
      bottom: 15px;
      text-align: center;
      width: 100%;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>

<body>
  <section class="hero">
    <img src="imagens/logo_branco.png" alt="Logo">
    <h1>Bem-vindo(a) ao Nosso Site</h1>
    <p>Explore nossos serviços e descubra tudo o que podemos oferecer para facilitar o seu dia a dia.</p>
    <a href="Login.html" class="btn-custom">Entrar</a>
  </section>

  <footer>
    © 2025 - Todos os direitos reservados | Seu Site
  </footer>
</body>
</html>
