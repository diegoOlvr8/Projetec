<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: dodgerblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            font-family: cursive;
        }

        img {
            height: 300px;
            width: 300px;
            object-fit: contain;
            margin-bottom: 50px;
        }

        .btn {
            background-color: white;
            color: dodgerblue;
            font-weight: bold;
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #f0f0f0;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Bem-Vindo(a)</h1>
        <img src="logoputeirododavi.png" alt="Logo">
        <a href="home.html" class="btn">Próximo</a>
    </div>
</body>
</html>
