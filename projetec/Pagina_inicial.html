<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casa Simples - Página Inicial</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f6f9ff;
    }

    .navbar {
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .navbar-brand img {
      height: 55px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
      height: 90vh;
      background: linear-gradient(rgba(0, 140, 255, 0.75), rgba(0, 110, 220, 0.85)),
      url('https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      color: white;
    }

    .hero img {
      height: 150px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      margin-top: 15px;
    }

    .btn-hero {
      margin-top: 30px;
      background: #00b7ff;
      padding: 12px 40px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      text-decoration: none;
      transition: 0.3s;
      display: inline-block;
    }

    .btn-hero:hover {
      background: #0095d6;
      transform: scale(1.05);
    }

    footer {
      background: #003b99;
      color: white;
      text-align: center;
      padding: 25px;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar px-4">
    <a class="navbar-brand" href="#">
      <img src="imagens/logo_branco.png" alt="Casa Simples">
    </a>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <img src="imagens/logo_branco.png" alt="Logo Casa Simples">

    <h1>Bem-vindo ao Casa Simples</h1>
    <p>Organização doméstica de um jeito moderno, simples e motivador.  
    Transforme tarefas em colaboração, união e resultados reais.</p>

    <a href="Login.html" class="btn-hero">Entrar</a>
    <br><br>
    <a href="saiba.html" class="btn-hero" style="background:white; color:#003b99;">Saiba Mais</a>
  </section>

  <footer>
    © 2025 — Casa Simples. Todos os direitos reservados.
  </footer>

</body>
</html>
