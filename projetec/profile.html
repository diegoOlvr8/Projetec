<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; }
    .bg-primary { background: dodgerblue !important; }

    .drag-handle {
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      font-weight: bold;
      font-size: 20px;
      user-select: none;
      color: #666;
    }
    .dragging {
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="bg-primary text-white p-3 d-flex justify-content-between">
    <h1>Perfil</h1>
    <a href="home.html" class="btn btn-light">Ir para Home</a>
  </div>

  <div class="container mt-3">
    <form id="perfilForm" class="row g-3">
      <div class="col-12">
        <h4>Informações Pessoais</h4>
      </div>
      <div class="col-md-6">
        <label class="form-label">Nome:</label>
        <input type="text" id="userName" class="form-control" required />
      </div>

      <div class="col-md-6">
        <label class="form-label">Foto de Perfil (Opcional):</label>
        <input type="file" id="userPhoto" class="form-control" accept="image/*" />
      </div>

      <div class="col-12 mt-4">
        <h4>Cômodos da Casa</h4>
        <div id="roomPicker">
          </div>
        <button type="button" class="btn btn-outline-secondary mt-2" onclick="adicionarComodo()">
          Adicionar Cômodo
        </button>
      </div>

      <div class="col-12 mt-4">
        <h4>Participantes da Competição</h4>
        <p class="text-muted small">Adicione os nomes dos membros da casa para o sistema de pontuação.</p>
        <div id="participantList" class="list-group mb-3">
          </div>
        <div class="input-group mb-3">
          <input type="text" id="newParticipantName" class="form-control" placeholder="Nome do Participante" />
          <button class="btn btn-outline-primary" type="button" onclick="adicionarParticipante()">
            Adicionar
          </button>
        </div>
      </div>
      <div class="col-12 text-center mt-4">
        <button type="submit" class="btn btn-primary btn-lg">Salvar Perfil</button>
      </div>
    </form>
  </div>

  <script>
    const roomTypes = {
      cozinha: "Cozinha",
      quarto: "Quarto",
      banheiro: "Banheiro",
      salaestar: "Sala de Estar",
      areadeservico: "Área de Serviço",
      garagem: "Garagem",
      varanda: "Varanda",
      jardim: "Jardim",
    };
    const roomPicker = document.getElementById("roomPicker");
    const participantList = document.getElementById('participantList');
    
    
    let currentParticipants = [];

    function getRoomTemplate(type = "quarto", label = "") {
      const typeOptions = Object.entries(roomTypes)
        .map(
          ([key, value]) =>
            `<option value="${key}" ${key === type ? "selected" : ""}>${value}</option>`
        )
        .join("");

      return `
        <div class="input-group mb-2 room-item">
          <span class="drag-handle"><i class="fas fa-grip-lines"></i></span>
          <select class="form-select room-type" style="max-width: 150px;">
            ${typeOptions}
          </select>
          <input type="text" class="form-control room-label" placeholder="Nome personalizado (ex: Quarto da Maria)" value="${label}">
          <input type="file" class="form-control room-photo" accept="image/*" style="max-width: 150px;">
          <button type="button" class="btn btn-danger" onclick="removerComodo(this)"><i class="fas fa-trash"></i></button>
        </div>
      `;
    }

    function adicionarComodo(type = "quarto", label = "") {
      roomPicker.insertAdjacentHTML("beforeend", getRoomTemplate(type, label));
      addDragListeners(roomPicker.lastElementChild);
    }
    
    function removerComodo(button) {
      button.closest(".room-item").remove();
    }
    
   
    function adicionarParticipante() {
      const nameInput = document.getElementById('newParticipantName');
      const name = nameInput.value.trim();
      if (name && !currentParticipants.some(p => p.name === name)) {
        const newId = Date.now().toString(); 
        currentParticipants.push({ id: newId, name: name });
        renderParticipants();
        nameInput.value = '';
      }
    }

    function removerParticipante(id) {
        currentParticipants = currentParticipants.filter(p => p.id !== id);
        renderParticipants();
    }

    function renderParticipants() {
        participantList.innerHTML = '';
        if (currentParticipants.length === 0) {
            participantList.innerHTML = '<li class="list-group-item text-muted">Nenhum participante adicionado.</li>';
            return;
        }

        currentParticipants.forEach(p => {
            const item = document.createElement('li');
            item.className = 'list-group-item d-flex justify-content-between align-items-center';
            item.innerHTML = `
                <span>${p.name}</span>
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="removerParticipante('${p.id}')">
                    <i class="fas fa-trash"></i>
                </button>
            `;
            participantList.appendChild(item);
        });
    }
   

    document.getElementById("perfilForm").addEventListener("submit", salvarPerfil);

    async function salvarPerfil(event) {
      event.preventDefault();
      const perfilSalvo = JSON.parse(localStorage.getItem("perfil") || "{}");
      const name = document.getElementById("userName").value;

      const photoInput = document.getElementById("userPhoto");
      let photoData = perfilSalvo?.photo || null;

      if (photoInput.files[0]) {
        photoData = await new Promise((res) => {
          const fr = new FileReader();
          fr.onload = () => res(fr.result);
          fr.readAsDataURL(photoInput.files[0]);
        });
      }

      
      const rooms = [];
      const groups = document.querySelectorAll("#roomPicker .room-item");

      for (let i = 0; i < groups.length; i++) {
        const grp = groups[i];
        const type = grp.querySelector(".room-type").value;
        let label = grp.querySelector(".room-label").value.trim();
        if (!label) label = `${roomTypes[type]} ${i + 1}`;
        const key = `${type}-${i + 1}`;

        const fileInput = grp.querySelector(".room-photo");
        let photo = null;

        if (fileInput.files[0]) {
          photo = await new Promise((resolve) => {
            const fr = new FileReader();
            fr.onload = () => resolve(fr.result);
            fr.readAsDataURL(fileInput.files[0]);
          });
        } else if (perfilSalvo?.rooms && perfilSalvo.rooms[i]?.photo) {
          photo = perfilSalvo.rooms[i].photo;
        }

        rooms.push({ type, key, label, photo });
      }

      
      const participantsToSave = currentParticipants;

      localStorage.setItem("perfil", JSON.stringify({ name, photo: photoData, rooms, participants: participantsToSave }));

      alert("Perfil e configurações salvos com sucesso!");
      window.location.href = "home.html";
    }

    function carregarPerfil() {
      const perfilSalvo = JSON.parse(localStorage.getItem("perfil") || "null");

      if (perfilSalvo) {
        document.getElementById("userName").value = perfilSalvo.name || "";

        roomPicker.innerHTML = "";
        (perfilSalvo.rooms || []).forEach((r) => {
          adicionarComodo(r.type, r.label);
        });

        
        currentParticipants = perfilSalvo.participants || [];
        renderParticipants();
      } else {
        adicionarComodo("cozinha"); 
      }
    }
    
    
    function addDragListeners(el) {
      
    }

    carregarPerfil();
  </script>
</body>
</html>
