<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { font-family: Arial, sans-serif; }
    .bg-primary { background: dodgerblue !important; }

    .drag-handle {
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      font-weight: bold;
      font-size: 20px;
      user-select: none;
      color: #666;
    }
    .dragging {
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="bg-primary text-white p-3 d-flex justify-content-between">
    <h1>Perfil</h1>
    <a href="home.html" class="btn btn-light">Ir para Home</a>
  </div>

  <div class="container mt-3">
    <form id="perfilForm" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nome:</label>
        <input type="text" id="userName" class="form-control" required />
      </div>

      <div class="col-md-6">
        <label class="form-label">Foto (opcional):</label>
        <input type="file" id="userPhoto" accept="image/*" class="form-control" />
      </div>

      <hr class="mt-4" />

      <h4>Selecione cômodos</h4>

      <div id="roomPicker" class="col-12"></div>

      <button type="button" id="addRoomBtn" class="btn btn-secondary mt-2">+ Adicionar cômodo</button>

      <div class="col-12">
        <button type="submit" class="btn btn-primary mt-3">Salvar perfil</button>
      </div>
    </form>
  </div>

  <script>
    const roomTypes = {
      cozinha: "Cozinha",
      quarto: "Quarto",
      banheiro: "Banheiro",
      salaestar: "Sala de Estar",
      areadeservico: "Área de Serviço",
      garagem: "Garagem",
      varanda: "Varanda",
      jardim: "Jardim",
    };

    const roomPickerDiv = document.getElementById("roomPicker");
    const addRoomBtn = document.getElementById("addRoomBtn");
    let roomIdx = 0;
    let dragSrcEl = null;

    function addRoomSelector(saved) {
      roomIdx++;
      const wrapper = document.createElement("div");
      wrapper.className = "input-group mb-3 d-flex align-items-center";
      wrapper.dataset.index = roomIdx;
      wrapper.setAttribute("draggable", "true");

      wrapper.innerHTML = `
        <div class="drag-handle" title="Arraste para reordenar" aria-label="Reordenar cômodo">≡</div>

        <select class="form-select room-type" style="width: 150px;">
          ${Object.entries(roomTypes)
            .map(
              ([k, v]) =>
                `<option value="${k}" ${
                  saved && saved.type === k ? "selected" : ""
                }>${v}</option>`
            )
            .join("")}
        </select>

        <input type="text" class="form-control room-label mx-2"
          placeholder="Nome do cômodo"
          value="${saved ? saved.label : ""}" />

        <input type="file" accept="image/*" class="form-control room-photo"
          style="max-width:200px;" />

        ${saved && saved.photo ? `<small class="text-success ms-2">Foto já carregada ✔</small>` : ""}

        <button class="btn btn-danger remove-room ms-2" type="button">&times;</button>
      `;

      roomPickerDiv.appendChild(wrapper);

      // Preview da imagem salva
      if (saved && saved.photo) {
        const preview = document.createElement("img");
        preview.src = saved.photo;
        preview.style.maxWidth = "80px";
        preview.style.marginLeft = "10px";
        wrapper.appendChild(preview);
      }

      wrapper.querySelector(".remove-room").addEventListener("click", () => wrapper.remove());

      // DRAG AND DROP
      wrapper.addEventListener("dragstart", (e) => {
        dragSrcEl = wrapper;
        e.dataTransfer.effectAllowed = "move";
        wrapper.classList.add("dragging");
      });

      wrapper.addEventListener("dragend", () => {
        wrapper.classList.remove("dragging");
      });

      wrapper.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
      });

      wrapper.addEventListener("dragenter", () => {
        if (wrapper !== dragSrcEl) {
          wrapper.style.borderTop = "2px solid dodgerblue";
        }
      });

      wrapper.addEventListener("dragleave", () => {
        wrapper.style.borderTop = "";
      });

      wrapper.addEventListener("drop", (e) => {
        e.preventDefault();
        if (wrapper !== dragSrcEl) {
          wrapper.style.borderTop = "";
          roomPickerDiv.insertBefore(dragSrcEl, wrapper);
        }
      });
    }

    addRoomBtn.addEventListener("click", () => addRoomSelector());

    // Carregar perfil salvo
    const perfilSalvo = JSON.parse(localStorage.getItem("perfil")) || null;
    if (perfilSalvo) {
      document.getElementById("userName").value = perfilSalvo.name || "";
      if (perfilSalvo.rooms) {
        perfilSalvo.rooms.forEach((r) => addRoomSelector(r));
      }
    } else {
      ["quarto", "cozinha", "banheiro"].forEach((t, i) =>
        addRoomSelector({ type: t, label: `${roomTypes[t]} ${i + 1}` })
      );
    }

    // Salvar perfil
    document.getElementById("perfilForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("userName").value.trim();
      if (!name) return alert("Digite seu nome!");

      const photoInput = document.getElementById("userPhoto");
      let photoData = perfilSalvo?.photo || null;

      if (photoInput.files[0]) {
        photoData = await new Promise((res) => {
          const fr = new FileReader();
          fr.onload = () => res(fr.result);
          fr.readAsDataURL(photoInput.files[0]);
        });
      }

      // ----- Salvar cômodos -----
      const rooms = [];
      const groups = document.querySelectorAll("#roomPicker .input-group");

      for (let i = 0; i < groups.length; i++) {
        const grp = groups[i];
        const type = grp.querySelector(".room-type").value;
        let label = grp.querySelector(".room-label").value.trim();
        if (!label) label = `${roomTypes[type]} ${i + 1}`;
        const key = `${type}-${i + 1}`;

        const fileInput = grp.querySelector(".room-photo");
        let photo = null;

        if (fileInput.files[0]) {
          photo = await new Promise((resolve) => {
            const fr = new FileReader();
            fr.onload = () => resolve(fr.result);
            fr.readAsDataURL(fileInput.files[0]);
          });
        } else if (perfilSalvo?.rooms[i]?.photo) {
          photo = perfilSalvo.rooms[i].photo;
        }

        rooms.push({ type, key, label, photo });
      }

      localStorage.setItem("perfil", JSON.stringify({ name, photo: photoData, rooms }));

      alert("Perfil salvo com sucesso!");
      window.location.href = "home.html";
    });
  </script>
</body>
</html>
